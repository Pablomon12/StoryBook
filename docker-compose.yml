services:
  api:
    build:
      context: .
    env_file:
      - .env
    expose:
      - "8000"
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/api/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001/api}
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8000/api}
    depends_on:
      api:
        condition: service_healthy
    environment:
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8000/api}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    restart: unless-stopped
